services:

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: capstone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-capstone_db}
      POSTGRES_USER:     ${DB_USER:-capstone_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-capstone_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-capstone_user} -d ${DB_NAME:-capstone_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── File watcher + capstone pipeline (GPU) ───────────────────────────────────
  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: capstone-watcher
    container_name: capstone-watcher
    restart: unless-stopped
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-capstone_db}
      DB_USER:     ${DB_USER:-capstone_user}
      DB_PASSWORD: ${DB_PASSWORD:-capstone_pass}
    volumes:
      # Project code (live — edits on host are reflected immediately)
      - .:/app
      # Shared drop folder: drop FITS files here from the host
      - ./FITSfileDropFolder:/srv/FITSfileDropFolder
      # Outputs written by the pipeline
      - ./outputs_capstone:/app/outputs_capstone
    depends_on:
      postgres:
        condition: service_healthy
    # GPU access — requires NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Web dashboard ────────────────────────────────────────────────────────────
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    image: capstone-webapp
    container_name: capstone-webapp
    restart: unless-stopped
    environment:
      WEB_HOST:    0.0.0.0
      WEB_PORT:    8000
      WEB_DEBUG:   "false"
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-capstone_db}
      DB_USER:     ${DB_USER:-capstone_user}
      DB_PASSWORD: ${DB_PASSWORD:-capstone_pass}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
